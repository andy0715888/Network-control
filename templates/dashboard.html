<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>端口映射控制面板</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">⇄</div>
            <span>端口映射面板</span>
        </div>
        <nav class="nav">
            <a href="#" class="nav-item active" data-tab="forward">端口映射</a>
            <a href="#" class="nav-item" data-tab="whitelist">白名单</a>
            <a href="#" class="nav-item" data-tab="status">规则状态</a>
            <a href="#" class="nav-item" data-tab="account">账号设置</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-box">
                <span class="user-avatar">{{ user[0]|upper }}</span>
                <span class="user-name">{{ user }}</span>
            </div>
            <a href="{{ url_for('logout') }}" class="btn-logout">退出登录</a>
        </div>
    </aside>

    <main class="main">
        <!-- 端口映射 -->
        <section class="tab-panel active" id="tab-forward">
            <div class="page-head">
                <h2>端口映射配置</h2>
                <p class="page-desc">将本机指定端口范围的所有流量转发到目标服务器，白名单内端口除外。</p>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>目标服务器 IP</label>
                            <input type="text" id="target_ip" placeholder="例如 2.2.2.2">
                            <span class="hint">流量将转发到此 IP</span>
                        </div>
                        <div class="form-group">
                            <label>转发协议</label>
                            <div class="checkbox-row">
                                <label class="checkbox"><input type="checkbox" id="proto_tcp" checked> TCP</label>
                                <label class="checkbox"><input type="checkbox" id="proto_udp" checked> UDP</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>起始端口</label>
                            <input type="number" id="port_start" min="1" max="65535" value="10000">
                        </div>
                        <div class="form-group">
                            <label>结束端口</label>
                            <input type="number" id="port_end" min="1" max="65535" value="60000">
                            <span class="hint">建议范围 10000-60000</span>
                        </div>
                    </div>
                    <div class="status-bar" id="enable_status">
                        <span class="status-dot" id="status_dot"></span>
                        <span id="status_text">加载中...</span>
                    </div>
                    <div class="action-row">
                        <button class="btn btn-primary" id="btn_save">保存配置</button>
                        <button class="btn btn-success" id="btn_apply">应用规则</button>
                        <button class="btn btn-danger" id="btn_clear">清除规则</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 白名单 -->
        <section class="tab-panel" id="tab-whitelist">
            <div class="page-head">
                <h2>端口白名单</h2>
                <p class="page-desc">白名单内的端口保留在本机，不会被转发到目标服务器。</p>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="form-grid add-wl-row">
                        <div class="form-group">
                            <label>端口</label>
                            <input type="number" id="wl_port" min="1" max="65535" placeholder="例如 22">
                        </div>
                        <div class="form-group">
                            <label>协议</label>
                            <select id="wl_protocol">
                                <option value="tcp,udp">TCP+UDP</option>
                                <option value="tcp">TCP</option>
                                <option value="udp">UDP</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>备注</label>
                            <input type="text" id="wl_note" placeholder="可选">
                        </div>
                        <div class="form-group form-action">
                            <button class="btn btn-primary" id="btn_add_wl">添加</button>
                        </div>
                    </div>
                    <div class="table-wrap">
                        <table class="table">
                            <thead>
                                <tr><th>端口</th><th>协议</th><th>备注</th><th>操作</th></tr>
                            </thead>
                            <tbody id="wl_table"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- 规则状态 -->
        <section class="tab-panel" id="tab-status">
            <div class="page-head">
                <h2>iptables 规则状态</h2>
                <p class="page-desc">当前服务器 nat 表的实际转发规则。</p>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="action-row">
                        <button class="btn btn-primary" id="btn_refresh_status">刷新</button>
                    </div>
                    <h4>PORT_FORWARD 链</h4>
                    <pre class="code-block" id="chain_output">加载中...</pre>
                    <h4>完整 nat 表</h4>
                    <pre class="code-block" id="nat_output">加载中...</pre>
                </div>
            </div>
        </section>

        <!-- 账号设置 -->
        <section class="tab-panel" id="tab-account">
            <div class="page-head">
                <h2>账号设置</h2>
                <p class="page-desc">修改登录账号和密码。</p>
            </div>
            <div class="card">
                <div class="card-body">
                    <h4>修改用户名</h4>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>新用户名</label>
                            <input type="text" id="new_username" placeholder="新账号">
                        </div>
                        <div class="form-group">
                            <label>当前密码 (验证)</label>
                            <input type="password" id="verify_pwd_username" placeholder="当前密码">
                        </div>
                        <div class="form-group form-action">
                            <button class="btn btn-primary" id="btn_change_username">修改用户名</button>
                        </div>
                    </div>
                    <hr class="divider">
                    <h4>修改密码</h4>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>原密码</label>
                            <input type="password" id="old_password" placeholder="原密码">
                        </div>
                        <div class="form-group">
                            <label>新密码</label>
                            <input type="password" id="new_password" placeholder="至少 6 位">
                        </div>
                        <div class="form-group">
                            <label>确认新密码</label>
                            <input type="password" id="confirm_password" placeholder="再次输入新密码">
                        </div>
                        <div class="form-group form-action">
                            <button class="btn btn-success" id="btn_change_password">修改密码</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="toast" id="toast"></div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
